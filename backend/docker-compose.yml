x-app-env: &app-env
  DB_CONNECTION: mysql
  DB_HOST: db
  DB_PORT: 3306
  CACHE_STORE: redis
  SESSION_DRIVER: redis
  QUEUE_CONNECTION: redis
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: null
  APP_URL: ${APP_URL:-http://localhost:8000}
  TRUSTED_PROXIES: '**'

services:
  db:
    image: mysql:8.0
    container_name: cafe_supply_chain_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-cafe_supply_chain}
      MYSQL_USER: ${DB_USERNAME:-cafe_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-cafe_pass}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_pass}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    networks:
      - cafe_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root_pass}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: cafe_supply_chain_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - cafe_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: cafe_supply_chain_app
    restart: unless-stopped
    working_dir: /var/www
    env_file:
      - .env
    environment:
      <<: *app-env
    volumes:
      - .:/var/www
      - vendor:/var/www/vendor
    networks:
      - cafe_network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  reverb:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: cafe_supply_chain_reverb
    restart: unless-stopped
    working_dir: /var/www
    env_file:
      - .env
    environment:
      <<: *app-env
      CONTAINER_ROLE: reverb
    volumes:
      - .:/var/www
      - vendor:/var/www/vendor
    networks:
      - cafe_network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: cafe_supply_chain_worker
    restart: unless-stopped
    working_dir: /var/www
    env_file:
      - .env
    environment:
      <<: *app-env
      CONTAINER_ROLE: worker
    volumes:
      - .:/var/www
      - vendor:/var/www/vendor
    networks:
      - cafe_network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_started
    # docker-entrypoint.sh detects CONTAINER_ROLE=worker and starts queue:work

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: cafe_supply_chain_scheduler
    restart: unless-stopped
    working_dir: /var/www
    env_file:
      - .env
    environment:
      <<: *app-env
      CONTAINER_ROLE: scheduler
    volumes:
      - .:/var/www
      - vendor:/var/www/vendor
    networks:
      - cafe_network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_started
    command: ["php", "artisan", "schedule:work"]

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: cafe_supply_chain_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    ports:
      - "8080:80"
    networks:
      - cafe_network
    depends_on:
      - db

  nginx:
    image: nginx:alpine
    container_name: cafe_supply_chain_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./storage/app/public:/var/www/storage/app/public:ro
    networks:
      - cafe_network
    depends_on:
      - app
      - reverb

volumes:
  mysql_data:
  redis_data:
  vendor:

networks:
  cafe_network:
    driver: bridge
