# Backend reverse proxy for independent backend development
# Routes:
#   /api/*     -> Laravel PHP-FPM (app:9000)
#   /docs      -> Swagger docs via Laravel
#   /storage/* -> Laravel storage/app/public
#   /app/local -> Reverb WebSocket

# Docker's embedded DNS. nginx resolves an `upstream` name once at startup and
# keeps that IP forever, so rebuilding the app container leaves this one
# proxying to an address nobody answers on — a 502 that only an nginx restart
# clears. Re-resolving per request through a variable removes that failure.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name localhost;

    error_log /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;

    # Backend API
    location /api/ {
        set $php_app app:9000;
        fastcgi_pass $php_app;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        include fastcgi_params;
    }

    # Telescope dev dashboard
    location /telescope {
        set $php_app app:9000;
        fastcgi_pass $php_app;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        include fastcgi_params;
    }

    # Swagger docs
    location /docs {
        set $php_app app:9000;
        fastcgi_pass $php_app;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        include fastcgi_params;
    }

    # Storage files
    location /storage/ {
        alias /var/www/storage/app/public/;
        try_files $uri $uri/ =404;
    }

    # Reverb WebSocket
    location /app/local {
        set $reverb_app http://reverb:8080;
        proxy_pass $reverb_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Everything else is not served by the backend container
    location / {
        return 404;
    }
}
