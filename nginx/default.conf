# Production reverse proxy
# Routes:
#   /api/*     -> Laravel backend via PHP-FPM (app:9000)
#   /storage/* -> Laravel backend via PHP-FPM (serves public/storage)
#   /cafe/*    -> Cafe React app (static Nginx)
#   /          -> Admin React app (static Nginx)

upstream app_backend {
    server app:9000;
}

server {
    listen 80;
    server_name localhost;

    error_log /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;

    # Backend API
    location /api/ {
        fastcgi_pass app_backend;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        include fastcgi_params;
    }

    # Storage files
    location /storage/ {
        alias /var/www/storage/app/public/;
        try_files $uri $uri/ =404;
    }

    # Cafe mobile app (served under /cafe/ prefix)
    location /cafe/ {
        proxy_pass http://cafe/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin dashboard (default)
    location / {
        proxy_pass http://admin/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
