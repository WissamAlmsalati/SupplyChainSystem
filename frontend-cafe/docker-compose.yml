services:
  cafe:
    image: node:20-alpine
    container_name: cafe_supply_chain_cafe
    restart: unless-stopped
    working_dir: /app
    environment:
      API_PROXY_TARGET: http://nginx
      VITE_BASE_PATH: /cafe/
    ports:
      - "5174:5174"
    volumes:
      - .:/app
      - cafe_node_modules:/app/node_modules
    networks:
      - cafe_network
    command: sh -c "npm ci && npm run dev -- --host"

volumes:
  cafe_node_modules:

networks:
  cafe_network:
    driver: bridge
