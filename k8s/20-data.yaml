# MySQL and Redis.
#
# Resource notes, because this node is shared: 7.8 GB of RAM with about 1.6 GB
# actually free, next to eight live sites. Every pod here asks for little and
# is capped. That deliberately makes them Burstable rather than Guaranteed, so
# under node pressure the kubelet evicts this stack before it evicts the
# neighbours — the newcomer should be the one that suffers, not octobits.ly.
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: cafe-supply-chain
spec:
  selector: { app: db }
  ports: [{ port: 3306, targetPort: 3306 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: cafe-supply-chain
spec:
  replicas: 1
  # Never two MySQLs on one data directory: the second corrupts it. Recreate
  # tears the old pod down before the new one starts; RollingUpdate would not.
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: db }
  template:
    metadata:
      labels: { app: db }
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          args:
            # MySQL 8 reserves a 128 MB buffer pool and a performance schema
            # that costs another ~200 MB by default. On a box with 1.6 GB free
            # that is most of the headroom for a catalogue this size.
            - --innodb-buffer-pool-size=128M
            - --performance-schema=OFF
            - --skip-host-cache
            - --skip-name-resolve
          env:
            - { name: MYSQL_DATABASE, value: cafe_supply_chain }
            - { name: MYSQL_USER, value: cafe_user }
            - name: MYSQL_PASSWORD
              valueFrom: { secretKeyRef: { name: cafe-secrets, key: DB_PASSWORD } }
            - name: MYSQL_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: cafe-secrets, key: DB_ROOT_PASSWORD } }
          ports: [{ containerPort: 3306 }]
          volumeMounts:
            - { name: data, mountPath: /var/lib/mysql }
          resources:
            requests: { memory: 320Mi, cpu: 100m }
            limits: { memory: 768Mi, cpu: "1" }
          livenessProbe:
            exec: { command: ["mysqladmin", "ping", "-h", "127.0.0.1"] }
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
          readinessProbe:
            exec: { command: ["mysqladmin", "ping", "-h", "127.0.0.1"] }
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: mysql-data }
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: cafe-supply-chain
spec:
  selector: { app: redis }
  ports: [{ port: 6379, targetPort: 6379 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: cafe-supply-chain
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args:
            - redis-server
            - --appendonly
            - "yes"
            # volatile-lru, not allkeys-lru: cache and session entries carry a
            # TTL and may be thrown away, queued jobs do not and must not be.
            # An order waiting to be delivered is in one of those lists.
            - --maxmemory
            - 128mb
            - --maxmemory-policy
            - volatile-lru
          ports: [{ containerPort: 6379 }]
          volumeMounts:
            - { name: data, mountPath: /data }
          resources:
            requests: { memory: 48Mi, cpu: 20m }
            limits: { memory: 192Mi, cpu: 500m }
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: redis-data }
