name: Deploy

# A release is an image tag. Every push to main that passes CI builds the two
# production images, pushes them to GHCR, and rolls the Kubernetes deployments
# over to them.
#
# The target is a shared single-node cluster that also runs octobits.ly,
# luxresale, fll.com.ly and five more sites. Everything this workflow touches
# is inside the cafe-supply-chain namespace, apart from three PersistentVolumes
# named for this project. It never restarts the ingress controller, never edits
# another namespace, and never changes a cluster-wide setting.
#
# The server keeps a checkout only for the manifests and scripts — application
# code never comes from git there, it comes from the image.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Existing image tag to roll back to (blank = build this commit)'
        required: false
        type: string

# Never let two deploys overlap; never cancel one halfway, which would leave
# the stack on a half-pulled set of images.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  ci:
    # Rolling back by hand should not wait on (or be blocked by) a rebuild.
    if: inputs.image_tag == ''
    uses: ./.github/workflows/ci.yml

  build:
    name: Build and push images
    if: inputs.image_tag == ''
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        name: Work out image names and tag
        run: |
          # GHCR rejects capitals, and the repository is WissamAlmsalati/SupplyChainSystem.
          echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          target: prod
          push: true
          tags: |
            ${{ steps.meta.outputs.prefix }}/backend:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.prefix }}/backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      # Built from the repository root: one nginx image carries both SPAs.
      - name: Frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/frontend/Dockerfile.prod
          push: true
          tags: |
            ${{ steps.meta.outputs.prefix }}/frontend:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.prefix }}/frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    name: Roll the cluster over
    needs: build
    # `always()` so a manual rollback, which skips ci and build, still runs.
    if: always() && (inputs.image_tag != '' || needs.build.result == 'success')
    runs-on: ubuntu-latest
    # The IP, USER and PASSWORD secrets are scoped to this environment, so the
    # name has to match it exactly or they resolve to empty strings.
    environment:
      name: development-env
      url: https://cafe.wissam.ly
    steps:
      - name: Install sshpass
        # The server authenticates with a password rather than a key, and ssh
        # will only read one from a terminal.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Deploy
        env:
          # sshpass reads the password from this variable, so it never appears
          # in the runner's process list or in the log.
          SSHPASS: ${{ secrets.PASSWORD }}
          HOST: ${{ secrets.IP }}
          REMOTE_USER: ${{ secrets.USER }}
          PORT: ${{ secrets.PORT || '22' }}
          # Optional: `ssh-keyscan -H <ip>` once, pasted into a secret of this
          # name, pins the server's identity. Without it the first connection
          # is trusted on sight.
          KNOWN_HOSTS: ${{ secrets.KNOWN_HOSTS }}
          TAG: ${{ inputs.image_tag || needs.build.outputs.tag }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$HOST" || { echo "The IP secret is empty — is the job's environment name right?" >&2; exit 1; }
          test -n "$REMOTE_USER" || { echo "The USER secret is empty." >&2; exit 1; }
          test -n "$SSHPASS" || { echo "The PASSWORD secret is empty." >&2; exit 1; }

          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          if [ -n "$KNOWN_HOSTS" ]; then
            printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
            STRICT=yes
          else
            STRICT=accept-new
          fi
          chmod 644 ~/.ssh/known_hosts 2>/dev/null || true

          # The checkout lives in the remote user's home, not /opt: no sudo is
          # available over a password login, and nothing here needs root that
          # kubectl does not already have.
          #
          # It is moved to this commit before the scripts run, so the manifests
          # and the deploy script that execute are the ones this release ships
          # with rather than the previous release's copies.
          #
          # The registry token rides in as a command-line variable. It is this
          # run's GITHUB_TOKEN, dead the moment the job ends, and reading it off
          # the server's process list already requires a shell there.
          sshpass -e ssh -p "$PORT" \
            -o StrictHostKeyChecking="$STRICT" \
            -o ConnectTimeout=20 \
            "$REMOTE_USER@$HOST" "
             set -e
             APP_DIR=\"\$HOME/cafe-supply-chain\"
             if [ ! -d \"\$APP_DIR/.git\" ]; then
               git clone https://github.com/WissamAlmsalati/SupplyChainSystem.git \"\$APP_DIR\"
             fi
             cd \"\$APP_DIR\"
             git fetch --prune origin
             git checkout --detach '$SHA'
             ./scripts/k8s-bootstrap.sh
             IMAGE_TAG='$TAG' REGISTRY_USER='$REGISTRY_USER' REGISTRY_TOKEN='$REGISTRY_TOKEN' ./scripts/k8s-deploy.sh"

      - name: Check the site answers
        run: |
          # Two minutes: cert-manager may still be finishing the HTTP-01
          # challenge on a first deploy, and an untrusted certificate fails
          # curl before the API is ever reached.
          for i in $(seq 1 12); do
            code=$(curl -fsS -o /dev/null -w '%{http_code}' https://cafe.wissam.ly/api/v1/categories || true)
            if [ "$code" = "200" ]; then
              echo "Up: /api/v1/categories answered 200 over a trusted certificate."
              exit 0
            fi
            echo "Attempt $i: got '${code:-no answer}', waiting."
            sleep 10
          done
          echo "The API did not answer 200 within two minutes."
          echo "If the site loads in a browser but this fails, the certificate"
          echo "is probably still pending: kubectl -n cafe-supply-chain get certificate"
          exit 1
