name: CI

on:
  pull_request:
  push:
    branches: [main]
  # deploy.yml calls this so a release can never ship past a red suite.
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend — Pint + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The Pint step below diffs against the base commit, which the
          # default depth-1 clone does not have.
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3

      # ponytail: the suite runs inside the image the project ships, not on the
      # runner's own PHP. Ubuntu's libsqlite3 is built with a parser stack that
      # gives up at 30 nested function calls, and ArabicText::sqlExpression()
      # wraps every searched column in 35 REPLACE()s — so on a runner the
      # Arabic search tests died with "parser stack overflow" while passing in
      # Docker (PHP's images bundle SQLite 3.46, which parses it) and on MySQL,
      # which is what production actually runs. Testing in the shipped image
      # keeps that whole class of "green here, red there" out of the pipeline.
      # The underlying depth is still worth reducing; see docs/deployment.md.
      - name: Build the dev image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          target: dev
          load: true
          tags: cafe-backend:ci
          cache-from: type=gha,scope=backend-dev
          cache-to: type=gha,mode=max,scope=backend-dev

      # Pint, the only PHP linter here, scoped to the files this change
      # touches. Twenty-nine files predate this pipeline and do not pass; a
      # repository-wide gate would be red on its first run, and the fix for
      # that is one deliberate `pint` commit of its own, not a reformat
      # smuggled into every unrelated pull request.
      - name: Pint (files this change touches)
        run: |
          base='${{ github.event.pull_request.base.sha || github.event.before }}'
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "No base commit to compare against — nothing to scope Pint to."
            exit 0
          fi
          files=$(git diff --name-only --diff-filter=ACMR "$base" HEAD \
                  | grep '^backend/.*\.php$' | sed 's|^backend/||' || true)
          if [ -z "$files" ]; then
            echo "No PHP files changed."
            exit 0
          fi
          echo "$files"
          docker run --rm -v "$PWD/backend:/src" -w /src \
            --entrypoint /var/www/vendor/bin/pint cafe-backend:ci --test $files

      # tests/ and phpunit.xml are kept out of the image by .dockerignore — a
      # release has no business carrying them — so they are mounted in. The
      # .env is written inside the container: without one, Laravel's warning
      # about the missing file turns all 236 tests yellow. phpunit.xml still
      # forces sqlite :memory:, so nothing here needs a database service.
      - name: Tests
        run: |
          docker run --rm \
            -v "$PWD/backend/tests:/var/www/tests:ro" \
            -v "$PWD/backend/phpunit.xml:/var/www/phpunit.xml:ro" \
            --entrypoint sh cafe-backend:ci \
            -c 'cp .env.example .env && php artisan key:generate --quiet && php artisan test'

  admin:
    name: Admin — oxlint + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-admin/package-lock.json

      - name: Install dependencies
        working-directory: frontend-admin
        run: npm ci --no-audit --no-fund

      - name: Lint
        working-directory: frontend-admin
        run: npm run lint

      - name: Build
        working-directory: frontend-admin
        run: npm run build

  customer:
    name: Customer — build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-customer/package-lock.json

      - name: Install dependencies
        working-directory: frontend-customer
        run: npm ci --no-audit --no-fund

      # The app is served under /customer/, so Vite must bake that prefix into
      # every asset URL — a root-path build 404s on its own JavaScript.
      # frontend-customer has no lint script.
      - name: Build
        working-directory: frontend-customer
        env:
          VITE_BASE_PATH: /customer/
        run: npm run build
