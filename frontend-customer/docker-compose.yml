services:
  customer:
    image: node:20-alpine
    container_name: cafe_supply_chain_customer
    restart: unless-stopped
    working_dir: /app
    environment:
      API_PROXY_TARGET: http://nginx
      VITE_BASE_PATH: /customer/
    ports:
      - "5174:5174"
    volumes:
      - .:/app
      - customer_node_modules:/app/node_modules
    networks:
      - cafe_network
    command: sh -c "npm ci && npm run dev -- --host"

volumes:
  customer_node_modules:

networks:
  cafe_network:
    driver: bridge
