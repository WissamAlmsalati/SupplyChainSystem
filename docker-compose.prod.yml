x-app-env: &app-env
  APP_ENV: production
  APP_DEBUG: "false"
  DB_CONNECTION: mysql
  DB_HOST: db
  DB_PORT: 3306
  DB_DATABASE: ${DB_DATABASE}
  DB_USERNAME: ${DB_USERNAME}
  DB_PASSWORD: ${DB_PASSWORD}
  CACHE_STORE: redis
  SESSION_DRIVER: redis
  QUEUE_CONNECTION: redis
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: null
  APP_URL: ${APP_URL:-http://localhost}
  TRUSTED_PROXIES: '**'

services:
  db:
    image: mysql:8.0
    container_name: cafe_supply_chain_db
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - cafe_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: cafe_supply_chain_redis
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - cafe_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    container_name: cafe_supply_chain_app
    restart: always
    working_dir: /var/www
    env_file:
      - .env
    environment:
      <<: *app-env
    volumes:
      - app_storage:/var/www/storage/app/public
    networks:
      - cafe_network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    container_name: cafe_supply_chain_worker
    restart: always
    working_dir: /var/www
    env_file:
      - .env
    environment:
      <<: *app-env
      CONTAINER_ROLE: worker
    networks:
      - cafe_network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_started
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--max-time=3600"]

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: cafe_supply_chain_admin
    restart: always
    networks:
      - cafe_network

  cafe:
    build:
      context: ./cafe
      dockerfile: Dockerfile
    container_name: cafe_supply_chain_cafe
    restart: always
    networks:
      - cafe_network

  web:
    image: nginx:alpine
    container_name: cafe_supply_chain_web
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - app_storage:/var/www/storage/app/public:ro
    networks:
      - cafe_network
    depends_on:
      - app
      - admin
      - cafe

volumes:
  mysql_data:
  redis_data:
  app_storage:

networks:
  cafe_network:
    driver: bridge
