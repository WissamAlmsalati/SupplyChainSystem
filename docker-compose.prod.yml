# Production stack for cafe.wissam.ly.
#
# Application code never comes from git on the server: `app`, `reverb`,
# `worker`, `scheduler` and `frontend` all run images built and tagged by
# .github/workflows/deploy.yml. The checkout at /opt/cafe-supply-chain exists
# only for this file, the nginx configs and scripts/. A release is IMAGE_TAG.
#
# Two env files, on the server only, neither in git:
#   .env          — read by compose: DOMAIN, IMAGE_TAG, the database credentials
#   backend/.env  — read by Laravel: APP_KEY, mail, gateway, Reverb secrets
# The database credentials live in the first and are pushed into the app from
# there, so the two files cannot drift into "access denied for user".
#
#   docker compose -f docker-compose.prod.yml up -d

name: cafe-supply-chain

x-logging: &logging
  # A chatty container can otherwise fill a small VPS disk and take MySQL
  # down with it.
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-app-env: &app-env
  APP_ENV: production
  APP_DEBUG: "false"
  APP_URL: https://${DOMAIN:?set DOMAIN in .env}
  DB_CONNECTION: mysql
  DB_HOST: db
  DB_PORT: 3306
  DB_DATABASE: ${DB_DATABASE:?set DB_DATABASE in .env}
  DB_USERNAME: ${DB_USERNAME:?set DB_USERNAME in .env}
  DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
  CACHE_STORE: redis
  SESSION_DRIVER: redis
  QUEUE_CONNECTION: redis
  REDIS_HOST: redis
  REDIS_PORT: 6379
  # Every request arrives through the edge nginx, so Laravel must trust the
  # X-Forwarded-* headers or it builds http:// URLs on an https:// site.
  TRUSTED_PROXIES: '**'
  TELESCOPE_ENABLED: "false"

x-app-service: &app-service
  image: ${BACKEND_IMAGE:-ghcr.io/wissamalmsalati/supplychainsystem/backend}:${IMAGE_TAG:-latest}
  restart: unless-stopped
  working_dir: /var/www
  env_file:
    - ./backend/.env
  networks:
    - cafe_network
  volumes:
    # Uploaded files and logs outlive the image; everything else in the
    # container is the release and is replaced wholesale on each deploy.
    - storage_public:/var/www/storage/app/public
    - storage_logs:/var/www/storage/logs
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: mysql:8.0
    container_name: cafe_supply_chain_db
    restart: unless-stopped
    <<: *logging
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:?set DB_DATABASE in .env}
      MYSQL_USER: ${DB_USERNAME:?set DB_USERNAME in .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
    ports:
      # This machine only. Reach it with:
      #   ssh -L 3307:127.0.0.1:3307 -L 8080:127.0.0.1:8080 user@cafe.wissam.ly
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - cafe_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: cafe_supply_chain_redis
    restart: unless-stopped
    <<: *logging
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - cafe_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # The web container, and the only one that migrates (docker-entrypoint.sh
  # leaves migrations alone for the other three roles).
  app:
    <<: [*app-service, *logging]
    container_name: cafe_supply_chain_app
    environment:
      <<: *app-env

  reverb:
    <<: [*app-service, *logging]
    container_name: cafe_supply_chain_reverb
    environment:
      <<: *app-env
      CONTAINER_ROLE: reverb
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]

  worker:
    <<: [*app-service, *logging]
    container_name: cafe_supply_chain_worker
    environment:
      <<: *app-env
      CONTAINER_ROLE: worker
    # docker-entrypoint.sh sees CONTAINER_ROLE=worker and starts queue:work

  # Required, not optional: OTP expiry and Sanctum token pruning are scheduled.
  scheduler:
    <<: [*app-service, *logging]
    container_name: cafe_supply_chain_scheduler
    environment:
      <<: *app-env
      CONTAINER_ROLE: scheduler
    command: ["php", "artisan", "schedule:work"]

  # Backend reverse proxy: FastCGI to app, WebSocket to reverb. Publishes no
  # port — only the edge container talks to it, over cafe_network.
  nginx:
    image: nginx:alpine
    container_name: cafe_supply_chain_nginx
    restart: unless-stopped
    <<: *logging
    volumes:
      - ./backend/docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - storage_public:/var/www/storage/app/public:ro
    networks:
      - cafe_network
    depends_on:
      - app
      - reverb

  # Public edge: TLS, both SPAs, everything else proxied to nginx above.
  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/wissamalmsalati/supplychainsystem/frontend}:${IMAGE_TAG:-latest}
    container_name: cafe_supply_chain_frontend
    restart: unless-stopped
    <<: *logging
    environment:
      # Substituted into the config template by the nginx image's entrypoint.
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/edge/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    networks:
      - cafe_network
    depends_on:
      - nginx
    # A renewed certificate is only picked up by a reload, so wake every six
    # hours and do one. The background loop starts first; nginx itself stays
    # in the foreground as PID 1's child so the container dies with it.
    command: >
      /bin/sh -c "while :; do sleep 6h & wait $${!}; nginx -s reload; done &
                  nginx -g 'daemon off;'"

  # Renewal only. The first certificate is issued by scripts/init-letsencrypt.sh,
  # which has to run before this stack can serve TLS at all.
  certbot:
    image: certbot/certbot:latest
    container_name: cafe_supply_chain_certbot
    restart: unless-stopped
    <<: *logging
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    # Let's Encrypt asks that renewal be attempted twice a day; certbot itself
    # does nothing until the certificate is inside 30 days of expiry.
    entrypoint: >
      /bin/sh -c "trap exit TERM; while :; do
                    certbot renew --webroot -w /var/www/certbot --quiet;
                    sleep 12h & wait $${!};
                  done"

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: cafe_supply_chain_phpmyadmin
    restart: unless-stopped
    <<: *logging
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    ports:
      # This machine only — reach it over the SSH tunnel above, never the edge.
      - "127.0.0.1:8080:80"
    networks:
      - cafe_network
    depends_on:
      - db

volumes:
  mysql_data:
  redis_data:
  storage_public:
  storage_logs:
  certbot_conf:
  certbot_www:

networks:
  cafe_network:
    driver: bridge
