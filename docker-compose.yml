x-app-env: &app-env
  DB_CONNECTION: mysql
  DB_HOST: db
  DB_PORT: 3306
  CACHE_STORE: redis
  SESSION_DRIVER: redis
  QUEUE_CONNECTION: redis
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: null
  APP_URL: ${APP_URL:-http://localhost}
  TRUSTED_PROXIES: '**'

services:
  db:
    image: mysql:8.0
    container_name: cafe_supply_chain_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-cafe_supply_chain}
      MYSQL_USER: ${DB_USERNAME:-cafe_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-cafe_pass}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_pass}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    networks:
      - cafe_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root_pass}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: cafe_supply_chain_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - cafe_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    container_name: cafe_supply_chain_app
    restart: unless-stopped
    working_dir: /var/www
    env_file:
      - .env.docker
    environment:
      <<: *app-env
    volumes:
      - ./backend:/var/www
      - vendor:/var/www/vendor
    networks:
      - cafe_network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  reverb:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    container_name: cafe_supply_chain_reverb
    restart: unless-stopped
    working_dir: /var/www
    env_file:
      - .env.docker
    environment:
      <<: *app-env
      CONTAINER_ROLE: reverb
    volumes:
      - ./backend:/var/www
      - vendor:/var/www/vendor
    networks:
      - cafe_network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    container_name: cafe_supply_chain_worker
    restart: unless-stopped
    working_dir: /var/www
    env_file:
      - .env.docker
    environment:
      <<: *app-env
      CONTAINER_ROLE: worker
    volumes:
      - ./backend:/var/www
      - vendor:/var/www/vendor
    networks:
      - cafe_network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_started
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--max-time=3600"]

  admin:
    image: node:20-alpine
    container_name: cafe_supply_chain_admin
    restart: unless-stopped
    working_dir: /app
    environment:
      API_PROXY_TARGET: http://web
    volumes:
      - ./frontend-admin:/app
      - admin_node_modules:/app/node_modules
    networks:
      - cafe_network
    command: sh -c "npm ci && npm run dev -- --host"

  cafe:
    image: node:20-alpine
    container_name: cafe_supply_chain_cafe
    restart: unless-stopped
    working_dir: /app
    environment:
      API_PROXY_TARGET: http://web
      VITE_BASE_PATH: /cafe/
    volumes:
      - ./frontend-cafe:/app
      - cafe_node_modules:/app/node_modules
    networks:
      - cafe_network
    command: sh -c "npm ci && npm run dev -- --host"

  web:
    image: nginx:alpine
    container_name: cafe_supply_chain_web
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/storage/app/public:/var/www/storage/app/public:ro
    networks:
      - cafe_network
    depends_on:
      - app
      - admin
      - cafe

volumes:
  mysql_data:
  redis_data:
  vendor:
  admin_node_modules:
  cafe_node_modules:

networks:
  cafe_network:
    driver: bridge
