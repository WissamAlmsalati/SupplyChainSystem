# Combined frontend: admin at /, cafe at /cafe/, API proxied to backend nginx
upstream backend_nginx {
    server nginx:80;
}

server {
    listen 80;
    server_name _;

    error_log /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API → backend container
    location /api/ {
        proxy_pass http://backend_nginx;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API docs → backend container
    location /docs {
        proxy_pass http://backend_nginx;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Storage files → backend container (fallback for images)
    location /storage/ {
        proxy_pass http://backend_nginx;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Hashed build assets → cache forever (filename changes on every build)
    location /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Cafe app at /cafe/
    location /cafe/ {
        alias /usr/share/nginx/html/cafe/;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /cafe/index.html;
    }

    # Admin app at / — HTML must revalidate so new builds are picked up
    location / {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
