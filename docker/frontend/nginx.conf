# Combined frontend: admin at /, customer at /customer/, API proxied to backend nginx
upstream backend_nginx {
    server nginx:80;
}

server {
    listen 80;
    server_name _;

    # TLS is terminated in front of this container (OrbStack / proxy): keep redirects
    # relative, otherwise "/customer" -> "http://host/customer/" drops HTTPS and the login session.
    absolute_redirect off;

    error_log /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;


    # API → backend container
    location /api/ {
        proxy_pass http://backend_nginx;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API docs → backend container
    location /docs {
        proxy_pass http://backend_nginx;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Reverb WebSocket - backend nginx -> reverb
    location /app/local {
        proxy_pass http://backend_nginx;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Storage files → backend container (fallback for images)
    location /storage/ {
        proxy_pass http://backend_nginx;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Telescope dev dashboard → backend container
    location /telescope {
        proxy_pass http://backend_nginx;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build assets → cache forever (filename changes on every build)
    location /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Customer app at /customer/
    location /customer/ {
        alias /usr/share/nginx/html/customer/;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /customer/index.html;
    }

    # nginx's mime.types has no .webmanifest entry, and a manifest served as
    # octet-stream is ignored by some installers. Naming the file beats a
    # server-level types block, which would replace the whole map.
    location = /manifest.webmanifest {
        root /usr/share/nginx/html;
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # The service worker must never be served stale, or a released build stays
    # invisible behind the worker that cached the last one.
    location = /sw.js {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # Admin app at / — HTML must revalidate so new builds are picked up
    location / {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
