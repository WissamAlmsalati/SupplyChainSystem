# Production config for the frontend image: the two built SPAs and nothing
# else. TLS and the API routing both live in the Kubernetes Ingress, so there
# is no proxying and no certificate here.
server {
    listen 80;
    server_name _;

    # TLS is terminated at the ingress. Relative redirects keep "/customer"
    # from bouncing to http:// and dropping the session.
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    # Hashed build output: the filename changes every build, so it can be
    # cached for ever.
    location /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /customer/ {
        alias /usr/share/nginx/html/customer/;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /customer/index.html;
    }

    # nginx's mime.types has no .webmanifest entry, and a manifest served
    # as octet-stream is ignored by some installers.
    location = /manifest.webmanifest {
        root /usr/share/nginx/html;
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # The service worker must never be stale, or a release stays invisible
    # behind the worker that cached the last one.
    location = /sw.js {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location / {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
